services:
  - type: web
    name: minesight
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MINESIGHT_SECRET
        generateValue: true
      - key: HTTPS
        value: "1"
      - key: ALLOW_SIGNUP
        value: "0"
      - key: DATA_DIR
        value: /tmp/minesight-data
